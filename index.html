<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b100e" />

  <title>Sahil & Divya | Wedding Invitation</title>

  <!-- =========================================================
       GOOGLE FONTS
       ========================================================= -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================================
       1. CSS VARIABLES
       ========================================================= */

    :root {
      --bg: #080d0b;
      --bg-soft: #0e1512;
      --bg-card: #111916;
      --bg-card-2: #151e1a;

      --gold: #d4af37;
      --gold-light: #f6e7a5;
      --gold-soft: #c8ae68;

      --ivory: #f7f1df;
      --white: #ffffff;
      --muted: #aaa99f;
      --line: rgba(212, 175, 55, 0.25);

      --serif: "Cinzel", serif;
      --script: "Great Vibes", cursive;
      --sans: "Montserrat", sans-serif;

      --max-width: 1180px;

      --shadow:
        0 25px 80px rgba(0, 0, 0, 0.45);

      --transition:
        0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* =========================================================
       BASIC RESET
       ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 80px;
    }

    body {
      background: var(--bg);
      color: var(--ivory);
      font-family: var(--sans);
      overflow-x: hidden;
      line-height: 1.7;
    }

    body.locked {
      overflow: hidden;
    }

    img {
      max-width: 100%;
      display: block;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ::selection {
      background: var(--gold);
      color: #111;
    }

    /* =========================================================
       COMMON UTILITIES
       ========================================================= */

    .container {
      width: min(92%, var(--max-width));
      margin-inline: auto;
    }

    .section {
      padding: 110px 0;
      position: relative;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 60px;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 0.72rem;
      letter-spacing: 0.32em;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .section-heading h2 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(1.8rem, 4vw, 3rem);
      letter-spacing: 0.08em;
    }

    .section-heading p {
      max-width: 650px;
      margin: 15px auto 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .gold-line {
      width: 60px;
      height: 1px;
      background: var(--gold);
      margin: 20px auto;
    }

    .script {
      font-family: var(--script);
      color: var(--gold-light);
    }

    /* =========================================================
       2. NAVIGATION
       ========================================================= */

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 5000;
      padding: 15px 0;
      transition: var(--transition);
    }

    .navbar.scrolled {
      background: rgba(7, 12, 10, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
    }

    .nav-inner {
      width: min(94%, 1250px);
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      width: 45px;
      height: 45px;
      border: 1px solid rgba(246, 231, 165, 0.7);
      border-radius: 50%;

      display: grid;
      place-items: center;

      color: var(--gold-light);
      font-family: var(--serif);
      font-size: 0.75rem;
      letter-spacing: 0.05em;

      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 30px;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      color: rgba(255, 255, 255, 0.78);
      transition: var(--transition);
    }

    .nav-links a:hover {
      color: var(--gold-light);
    }

    .menu-btn {
      display: none;
      width: 43px;
      height: 43px;

      border: 1px solid rgba(212, 175, 55, 0.4);
      background: rgba(0, 0, 0, 0.2);
      color: var(--gold-light);
      border-radius: 50%;
    }

    /* =========================================================
       3. SCRATCH SCREEN
       ========================================================= */

    .scratch-screen {
      position: fixed;
      inset: 0;
      z-index: 10000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(212, 175, 55, 0.12),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #060908,
          #101713 50%,
          #070b09
        );

      transition:
        opacity 1s ease,
        visibility 1s ease;
    }

    .scratch-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .scratch-wrapper {
      width: min(92vw, 570px);
      text-align: center;
    }

    .scratch-top-label {
      font-family: var(--serif);
      font-size: 0.7rem;
      letter-spacing: 0.42em;
      color: var(--gold-light);
      margin-bottom: 15px;
    }

    .scratch-wrapper h1 {
      font-family: var(--script);
      color: var(--gold-light);
      font-size: clamp(3rem, 11vw, 5.5rem);
      font-weight: 400;
      line-height: 1;
      margin-bottom: 30px;
    }

    .scratch-card {
      position: relative;
      width: 100%;
      aspect-ratio: 1.7 / 1;

      border-radius: 18px;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 30% 20%,
          rgba(255,255,255,.12),
          transparent 25%
        ),
        linear-gradient(
          135deg,
          #8e7120,
          #f0d675,
          #a88220,
          #f5df86,
          #8e6b19
        );

      box-shadow:
        0 30px 100px rgba(0,0,0,.65),
        inset 0 0 0 1px rgba(255,255,255,.35);

      touch-action: none;
      user-select: none;
    }

    .scratch-card::before {
      content: "";
      position: absolute;
      inset: 10px;

      border: 1px solid rgba(255,255,255,.4);
      border-radius: 12px;

      pointer-events: none;
      z-index: 2;
    }

    .scratch-reveal {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;

      background:
        radial-gradient(
          circle at center,
          rgba(255,255,255,.08),
          transparent 55%
        ),
        #151b17;

      padding: 20px;
    }

    .scratch-reveal .small {
      font-family: var(--serif);
      color: var(--gold);
      font-size: 0.68rem;
      letter-spacing: 0.35em;
      margin-bottom: 8px;
    }

    .scratch-reveal .couple {
      font-family: var(--script);
      color: var(--gold-light);
      font-size: clamp(2.8rem, 10vw, 4.5rem);
      line-height: 1.1;
    }

    .scratch-reveal .date {
      font-family: var(--serif);
      font-size: clamp(0.85rem, 3vw, 1.15rem);
      letter-spacing: 0.25em;
      color: var(--ivory);
      margin-top: 10px;
    }

    .scratch-reveal .place {
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      color: var(--gold-soft);
      margin-top: 5px;
    }

    #scratchCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;

      cursor: crosshair;
      touch-action: none;
    }

    .scratch-instruction {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      z-index: 4;

      pointer-events: none;

      font-family: var(--serif);
      color: #2b2410;
      font-weight: 700;
      letter-spacing: 0.18em;
      font-size: clamp(0.65rem, 2vw, 0.85rem);

      white-space: nowrap;

      text-shadow:
        0 1px rgba(255,255,255,.3);
    }

    .scratch-bottom {
      margin-top: 22px;
      color: rgba(255,255,255,.55);
      font-size: 0.68rem;
      letter-spacing: 0.15em;
    }

    /* =========================================================
       4. HERO
       ========================================================= */

    .hero {
      min-height: 100svh;
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
      overflow: hidden;

      background:
        linear-gradient(
          rgba(3, 7, 5, 0.56),
          rgba(3, 7, 5, 0.82)
        ),
        url("https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=2200&q=85")
        center / cover;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at center,
          transparent 10%,
          rgba(0,0,0,.35) 75%
        );
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;

      width: min(92%, 900px);
      padding-top: 40px;

      animation: heroIn 1.5s ease both;
    }

    .hero-script {
      font-family: var(--script);
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      color: var(--gold-light);
      line-height: 1;
    }

    .hero-names {
      font-family: var(--serif);
      font-weight: 500;

      font-size: clamp(3rem, 10vw, 7rem);
      letter-spacing: 0.06em;
      line-height: 1.05;

      margin: 12px 0 18px;

      background:
        linear-gradient(
          110deg,
          #f6e7a5,
          #d4af37,
          #fff2b4,
          #c59c2d
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-subtitle {
      font-family: var(--serif);
      color: rgba(255,255,255,.82);
      font-size: clamp(0.75rem, 2vw, 1rem);
      letter-spacing: 0.18em;
    }

    .hero-date {
      margin-top: 30px;
      font-family: var(--serif);
      color: var(--gold-light);
      font-size: 0.75rem;
      letter-spacing: 0.28em;
    }

    .scroll-indicator {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 2;

      font-size: 0.58rem;
      letter-spacing: 0.3em;
      color: rgba(255,255,255,.55);
    }

    .scroll-indicator::after {
      content: "";
      display: block;

      width: 1px;
      height: 35px;

      background: var(--gold);
      margin: 9px auto 0;

      animation: scrollLine 1.8s infinite;
    }

    /* =========================================================
       5. COUNTDOWN
       ========================================================= */

    .countdown-section {
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(212,175,55,.08),
          transparent 45%
        ),
        var(--bg);
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      max-width: 850px;
      margin: auto;

      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .count-box {
      padding: 35px 10px;
      text-align: center;
      position: relative;
    }

    .count-box:not(:last-child)::after {
      content: "";
      position: absolute;
      right: 0;
      top: 25%;
      height: 50%;
      width: 1px;
      background: var(--line);
    }

    .count-number {
      font-family: var(--serif);
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--gold-light);
      line-height: 1;
    }

    .count-label {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.6rem;
      letter-spacing: 0.25em;
    }

    .wedding-day-message {
      display: none;
      text-align: center;
      font-family: var(--serif);
      color: var(--gold-light);
      font-size: clamp(1.4rem, 4vw, 2.5rem);
      letter-spacing: 0.08em;
    }

    /* =========================================================
       6. STORY
       ========================================================= */

    .story-section {
      background: var(--bg-soft);
    }

    .story-content {
      max-width: 780px;
      margin: auto;
      text-align: center;
    }

    .story-content .script-title {
      font-family: var(--script);
      color: var(--gold-light);
      font-size: clamp(3rem, 8vw, 5rem);
      line-height: 1;
      margin-bottom: 25px;
    }

    .story-content p {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 2;
      margin-bottom: 20px;
    }

    /* =========================================================
       7. EVENTS
       ========================================================= */

    .events-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .event-card {
      position: relative;
      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.025),
          rgba(212,175,55,.03)
        ),
        var(--bg-card);

      border: 1px solid rgba(212,175,55,.18);
      border-radius: 18px;

      padding: 45px 28px;

      text-align: center;

      transition: var(--transition);
    }

    .event-card:hover {
      transform: translateY(-8px);
      border-color: rgba(212,175,55,.5);
      box-shadow: var(--shadow);
    }

    .event-number {
      font-family: var(--serif);
      color: rgba(212,175,55,.3);
      font-size: 3rem;
      line-height: 1;
      margin-bottom: 20px;
    }

    .event-card h3 {
      font-family: var(--serif);
      font-size: 1.5rem;
      color: var(--gold-light);
      letter-spacing: 0.08em;
      margin-bottom: 18px;
    }

    .event-date {
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      color: var(--gold);
      margin-bottom: 16px;
    }

    .event-venue {
      font-family: var(--serif);
      color: var(--ivory);
      font-size: 0.9rem;
    }

    .event-location {
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 3px;
    }

    .event-description {
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.8;
      margin-top: 22px;
    }

    .event-card::before {
      content: "";
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;

      border: 1px solid rgba(212,175,55,.08);

      top: -50px;
      right: -50px;
    }

    .event-card:nth-child(2)::before {
      border-radius: 0;
      transform: rotate(45deg);
    }

    .event-card:nth-child(3)::before {
      width: 80px;
      height: 80px;
      top: 20px;
      right: 20px;
    }

    /* =========================================================
       8. GALLERY
       ========================================================= */

    .gallery-section {
      background: var(--bg-soft);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 230px;
      gap: 12px;
    }

    .gallery-item {
      overflow: hidden;
      border-radius: 10px;
      position: relative;
      background: #111;
    }

    .gallery-item:nth-child(1) {
      grid-column: span 2;
      grid-row: span 2;
    }

    .gallery-item:nth-child(4) {
      grid-row: span 2;
    }

    .gallery-item:nth-child(6) {
      grid-column: span 2;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;

      transition:
        transform 0.8s cubic-bezier(.2,.8,.2,1),
        filter .5s ease;
    }

    .gallery-item::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          transparent 50%,
          rgba(0,0,0,.35)
        );

      pointer-events: none;
    }

    .gallery-item:hover img {
      transform: scale(1.07);
      filter: brightness(1.05);
    }

    /* =========================================================
       9. VENUE
       ========================================================= */

    .venue-section {
      background:
        radial-gradient(
          circle at 50% 100%,
          rgba(212,175,55,.08),
          transparent 40%
        ),
        var(--bg);
    }

    .venue-main {
      text-align: center;
      max-width: 800px;
      margin: auto;
    }

    .venue-main h3 {
      font-family: var(--serif);
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--gold-light);
      font-weight: 500;
    }

    .venue-place {
      color: var(--muted);
      margin: 10px 0;
    }

    .venue-date {
      color: var(--gold);
      font-family: var(--serif);
      letter-spacing: .18em;
      font-size: .75rem;
    }

    .location-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      margin-top: 28px;
      padding: 14px 25px;

      border: 1px solid var(--gold);
      color: var(--gold-light);

      font-size: 0.65rem;
      letter-spacing: .2em;

      transition: var(--transition);
    }

    .location-btn:hover {
      background: var(--gold);
      color: #111;
    }

    .timeline {
      max-width: 800px;
      margin: 75px auto 0;
      position: relative;
    }

    .timeline::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: var(--line);
      transform: translateX(-50%);
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      margin-bottom: 45px;
      position: relative;
    }

    .timeline-item:nth-child(even) {
      direction: rtl;
    }

    .timeline-item:nth-child(even) .timeline-content {
      direction: ltr;
    }

    .timeline-date {
      text-align: right;
      color: var(--gold);
      font-family: var(--serif);
      font-size: .75rem;
      letter-spacing: .1em;
    }

    .timeline-item:nth-child(even) .timeline-date {
      text-align: left;
    }

    .timeline-content h4 {
      font-family: var(--serif);
      color: var(--ivory);
      font-size: 1rem;
    }

    .timeline-content p {
      color: var(--muted);
      font-size: .75rem;
      margin-top: 3px;
    }

    /* =========================================================
       10. RSVP
       ========================================================= */

    .rsvp-section {
      background: var(--bg-soft);
    }

    .rsvp-box {
      max-width: 760px;
      margin: auto;

      background: var(--bg-card);
      border: 1px solid rgba(212,175,55,.2);
      border-radius: 20px;

      padding: clamp(25px, 6vw, 55px);

      box-shadow: var(--shadow);
    }

    .rsvp-heading {
      text-align: center;
      margin-bottom: 35px;
    }

    .rsvp-heading h3 {
      font-family: var(--serif);
      font-size: clamp(1.6rem, 5vw, 2.5rem);
      color: var(--gold-light);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: .62rem;
      letter-spacing: .16em;
      color: var(--gold-soft);
      margin-bottom: 7px;
    }

    .form-group
